# Copy this file outside the repository. Codex-only install works without
# Grok, opening text, GitHub accounts, or optional tools. Fill models at
# least. Native model slugs stay here; shared policy does not pin them.
# Declared cost/capability is not live credits. Freshness is the mapping at
# install, update, or actual use — do not auto-upgrade model names.

[opening]
instruction = ""

[runtime]
# Optional but recommended: an absolute Python 3.11+ path used by the prompt hook.
python = ""

[models]
# Local environment data only. Fill with the models available on this machine.
# Shared templates remain model-agnostic placeholders; do not copy current
# native version slugs into committed policy.
primary = ""
primary_effort = "high"
executor = ""
executor_effort = "low"
reviewer = ""

[routing]
# native_only: Codex executor is the complete normal path; Pi/Grok is not required.
# paid_preferred: prefer a configured paid/included executor that matches the task.
# paid_strict: same preference; fallback only on an explicit permitted cause.
# Configs that omit [routing] keep legacy Grok-preferred, quota-only native fallback.
# External dispatch is the generic Pi adapter. Do not invoke GrokCLI.
selection = "native_only"

[[routing.executors]]
id = "native"
backend = "codex"
# Empty model uses [models].executor. Arbitrary future native slugs are allowed.
capabilities = ["implementation", "tests", "git", "local_write"]
tools = ["workspace-write"]
cost_preference = "unknown"
availability = "configured"

# Optional paid external executor (uncomment and set selection to paid_preferred
# or paid_strict). Identity is local configuration, not a shared default.
# backend grok is the Pi adapter locked to xai/grok-4.6; thinking must be valid
# for that model (xhigh is valid, max is not). backend pi is generic.
# User cost_preference is a declaration, not a live balance.
# [[routing.executors]]
# id = "grok_build"
# backend = "grok"
# provider = "xai"
# requested_model = "grok-4.6"
# actual_model = "grok-4.6"
# effort = "xhigh"
# capabilities = ["implementation", "tests", "git", "local_write"]
# tools = ["workspace-write"]
# cost_preference = "paid_included"
# availability = "configured"
#
# [[routing.executors]]
# id = "deepseek_flash"
# backend = "pi"
# provider = "qwen-token-plan-cn"
# requested_model = "deepseek-v4.1-flash"
# actual_model = "deepseek-v4.1-flash"
# effort = "max"
# capabilities = ["implementation", "tests", "git", "local_write"]
# tools = ["workspace-write"]
# cost_preference = "paid_included"
# availability = "configured"
#
# [routing.fallback]
# permit = ["quota_exhausted"]
# target = "native"

[delivery]
# local_only (default) | pull_request | merge_if_ready
# GitHub modes require nonempty repositories. Credentials are not permission.
mode = "local_only"
repositories = []

[github]
# Optional. Unused under local_only. Not an authorization grant.
author_login = ""
author_config_dir = ""
reviewer_login = ""
reviewer_config_dir = ""

[tools]
# Optional paths used when a task needs them, and by explicit Doctor probes.
codegraph = ""
semble = ""
rtk = ""
